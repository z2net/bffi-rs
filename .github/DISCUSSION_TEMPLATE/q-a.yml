title: "[Q&A]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about **bffi-rs** - usage, design, or contribution.
        For bugs, please open an issue with the bug report template instead.

  - type: textarea
    attributes:
      label: Your question
      description: Include context - what you are building, what you tried, what you expected.
      placeholder: How do I ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment (if relevant)
      description: Bun version, Rust toolchain, OS.
      placeholder: |
        bun 1.4.2
        rust 1.98.0
        windows 11
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing discussions and issues first
          required: true
