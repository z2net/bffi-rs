# The fuzz workspace is deliberately toolchain-isolated from the
# repository: cargo-fuzz needs nightly (-Zsanitizer), while the
# repository workspace pins 1.98.0 via rust-toolchain.toml at the repo
# root. rustup resolves the CLOSEST toolchain file, so every cargo and
# cargo-fuzz command run inside this directory uses nightly
# automatically and the repository pin stays untouched. Never merge
# this file with the repository one.
[toolchain]
channel = "nightly"
