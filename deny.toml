# Supply-chain policy for `cargo deny check` (CI job: supply-chain).
# Written against the cargo-deny v2 config schema:
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Schema v2: RUSTSEC vulnerabilities are always hard errors (there is no
# `vulnerability` level anymore); unmaintained/yanked only warn.
version = 2
unmaintained = "warn"
unsound = "warn"
yanked = "warn"

[licenses]
version = 2
# Anything not listed here is denied by default (unlicensed too).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
