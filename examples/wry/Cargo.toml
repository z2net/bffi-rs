[package]
name = "bffi-example-wry"
description = "Example bffi-rs native module: a wry (webview) binding driven from Bun - window + IPC on a dedicated native thread, the JS thread free to pump the bffi event loop."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/z2net/bffi-rs"
rust-version = "1.98.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes .bffi/bffi.api.json from module_def::MODULE (the loader JSON
# artifact consumed by the @z2net/bffi pipeline).
name = "emit-json"
path = "src/bin/emit_json.rs"

[dependencies]
bffi = "0.1.2"
# Pinned exactly (the wry dev line moves fast): the latest stable pair
# at the time of writing. wry needs any window implementing
# `HasWindowHandle`; winit 0.30 is the version wry itself tests
# against, and both share the same `dpi` crate (0.1) for sizes.
wry = "=0.57.0"
winit = "=0.30.13"
