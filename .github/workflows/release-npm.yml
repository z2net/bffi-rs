# Publishes every npm package of the repository when a GitHub release
# is published (a release implies the v* tag), in the dependency-safe
# order:
#
#   1. the eight @z2net/bffi-native-<triple> platform packages
#      (cdylib built per-OS, assembled with `bffi pack`);
#   2. the @z2net/bffi-native main package (its optionalDependencies
#      point at the platform packages above);
#   3. @z2net/bffi (the loader/pipeline);
#   4. @z2net/bffi-cli (depends on @z2net/bffi).
#
# Every publish is IDEMPOTENT: a version that already exists on the
# registry is skipped with a green check, so a re-run never fails on
# an already-published package.
#
# One-time setup (repository settings):
#   Secrets -> Actions -> NPM_TOKEN : an npm automation token with
#   access to the @z2net scope. npm authentication follows the
#   canonical pattern: actions/setup-node with registry-url writes
#   the .npmrc, npm publish authenticates through NODE_AUTH_TOKEN.
#
# After all packages are published, the pipeline dispatches the CI of
# z2net/bffi-examples - the examples consume the PUBLISHED packages,
# so a green run there is the end-to-end confirmation of the release.
# The dispatch needs a cross-repo token (the built-in GITHUB_TOKEN is
# scoped to this repository only):
#   Secrets -> Actions -> EXAMPLES_DISPATCH_TOKEN : a fine-grained
#   PAT with "Actions: read and write" on z2net/bffi-examples.
#   Without the secret the step skips gracefully (the release stays
#   green; the e2e gate runs manually instead).
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,       triple: win32-x64-msvc,   artifact: bffi_native.dll,   pkg: bffi-native-win32-x64-msvc }
          - { os: windows-11-arm,       triple: win32-arm64-msvc, artifact: bffi_native.dll,   pkg: bffi-native-win32-arm64-msvc }
          - { os: ubuntu-latest,    triple: linux-x64-gnu,    artifact: libbffi_native.so, pkg: bffi-native-linux-x64-gnu }
          - { os: ubuntu-latest,    triple: linux-x64-musl,   artifact: libbffi_native.so, pkg: bffi-native-linux-x64-musl,   target: x86_64-unknown-linux-musl, musl: "true" }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-gnu,  artifact: libbffi_native.so, pkg: bffi-native-linux-arm64-gnu }
          - { os: ubuntu-24.04-arm, triple: linux-arm64-musl, artifact: libbffi_native.so, pkg: bffi-native-linux-arm64-musl, target: aarch64-unknown-linux-musl, musl: "true" }
          - { os: macos-latest,     triple: darwin-aarch64,   artifact: libbffi_native.dylib, pkg: bffi-native-darwin-aarch64 }
          # darwin-x64 is CROSS-COMPILED on the arm64 runner: the
          # Xcode toolchain links x86_64-apple-darwin natively, and
          # the macos-13 (x64) runner pool is too starved to rely on.
          - { os: macos-latest,     triple: darwin-x64,       artifact: libbffi_native.dylib, pkg: bffi-native-darwin-x64, target: x86_64-apple-darwin }
    name: build-platform (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install musl tools (musl cdylib linker)
        if: matrix.musl == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The `bffi pack` step runs the CLI, which imports `@z2net/bffi`.
      # Without an install, bun's auto-install would fetch the LATEST
      # PUBLISHED version from the registry - the PREVIOUS release
      # (0.2.0 is published by this very run). The lockfile resolves
      # `@z2net/bffi` to the WORKSPACE package, so the CLI runs the
      # sources being released.
      - name: bun install
        run: bun install --frozen-lockfile

      - name: Build the release cdylib
        shell: bash
        env:
          # musl targets default to crt-static, and rustc drops the
          # cdylib for a statically-linked musl target; dynamic musl
          # linking is exactly what a platform .so needs.
          RUSTFLAGS: ${{ matrix.musl == 'true' && '-C target-feature=-crt-static' || '' }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p bffi-native --target ${{ matrix.target }}
          else
            cargo build --release -p bffi-native
          fi

      - name: Assemble the platform package (bffi pack)
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            ARTIFACT="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          else
            ARTIFACT="target/release/${{ matrix.artifact }}"
          fi
          bun packages/bffi-cli/bin/bffi.ts pack \
            --src "$ARTIFACT" \
            --triple ${{ matrix.triple }} \
            --name @z2net/bffi-native \
            --binary bffi_native \
            --out platform

      # Canonical npm authentication: setup-node + registry-url writes
      # the .npmrc, NODE_AUTH_TOKEN authenticates the publish.
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish the platform package (skip if the version exists)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd platform/${{ matrix.pkg }}
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published - skipping."
          else
            npm publish --access public --provenance
          fi

  publish-native-main:
    name: publish @z2net/bffi-native
    needs: build-platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi-native (skip if the version exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/native
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published - skipping."
          else
            npm publish --access public --provenance
          fi

  publish-bffi:
    name: publish @z2net/bffi
    needs: publish-native-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi (skip if the version exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/bffi
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published - skipping."
          else
            npm publish --access public --provenance
          fi

  # The end-to-end gate: the bffi-examples CI builds every example
  # crate and runs its e2e suite against the packages that were JUST
  # published above. A green run there confirms the release works for
  # a real consumer installing from the registry.
  notify-examples-e2e:
    name: dispatch the bffi-examples e2e gate
    needs: publish-bffi-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the bffi-examples CI
        env:
          GH_TOKEN: ${{ secrets.EXAMPLES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "EXAMPLES_DISPATCH_TOKEN is not configured - skipping the automatic e2e gate."
            echo "Set a fine-grained PAT (Actions: read and write on z2net/bffi-examples)"
            echo "as a repository secret to enable it, or dispatch manually:"
            echo "  gh workflow run ci --repo z2net/bffi-examples --ref main"
            exit 0
          fi
          gh workflow run ci --repo z2net/bffi-examples --ref main
          echo "bffi-examples CI dispatched - the examples are validating themselves"
          echo "against the freshly published packages."

  publish-bffi-cli:
    name: publish @z2net/bffi-cli
    needs: publish-bffi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @z2net/bffi-cli (skip if the version exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          cd packages/bffi-cli
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published - skipping."
          else
            npm publish --access public --provenance
          fi
