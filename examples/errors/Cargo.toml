[package]
name = "bffi-example-errors"
description = "Example bffi-rs native module: the B3 typed error surface (#[derive(BffiError)] codes, variant payloads, backtraces) consumed through the @z2net/bffi pipeline. Dependencies come from the package registries (npm: @z2net/bffi, crates.io: bffi)."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/z2net/bffi-rs"
rust-version = "1.98.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes .bffi/bffi.api.json from module_def::MODULE (the loader JSON
# artifact consumed by the @z2net/bffi pipeline).
name = "emit-json"
path = "src/bin/emit_json.rs"

[dependencies]
bffi = { version = "0.1.3", features = ["macros"] }
