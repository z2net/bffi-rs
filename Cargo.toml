[workspace]
resolver = "2"
members = [
    "crates/bffi",
    "crates/bffi-macros",
    "crates/bffi-native",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/z2net/bffi-rs"
authors = ["DotBlood"]
rust-version = "1.98.0"
readme = "README.md"
keywords = ["bffi", "bun", "ffi", "native", "rust"]
categories = ["development-tools::ffi", "api-bindings"]

[workspace.dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"

# Dogfood: workspace members (bffi-native) declare the published
# registry versions so the manifest doubles as an installation
# example; patch them onto the local crates so tests exercise the
# working tree, not the last release.
[patch.crates-io]
bffi = { path = "crates/bffi" }
bffi-macros = { path = "crates/bffi-macros" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"

# NOTE: `panic` intentionally stays "unwind" (the default). The shipped
# artifact is a cdylib loaded into the Bun host process, and the safety
# model (docs/DESIGN.md §6.5) requires `catch_unwind` to convert panics
# into JS errors instead of killing Bun.
[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
