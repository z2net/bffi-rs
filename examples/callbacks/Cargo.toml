[package]
name = "bffi-example-callbacks"
description = "Example bffi-rs native module: the callback surface (JS->Rust lifecycle, Rust->JS ownership, wrong-thread + marshal delivery), doubling as the e2e test of the .bffi pipeline."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/z2net/bffi-rs"
rust-version = "1.98.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes .bffi/bffi.api.json from module_def::MODULE (the loader JSON
# artifact consumed by the @z2net/bffi pipeline).
name = "emit-json"
path = "src/bin/emit_json.rs"

[dependencies]
bffi = "0.1.3"
