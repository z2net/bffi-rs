# Publishes the two crates.io packages of the repository when a GitHub
# release is published (a release implies the v* tag), in the
# dependency-safe order: `bffi-macros` first (the `bffi` facade has an
# optional dependency on it), then the `bffi` facade.
#
# Publishes are IDEMPOTENT: a version that already exists on crates.io
# is skipped (crates.io versions are immutable - re-publishing fails
# with "already exists", which the pipeline treats as skip).
#
# One-time setup (repository settings):
#   Secrets -> Actions -> CRATES_TOKEN : a crates.io API token with
#   publish access (crates.io -> Account Settings -> API Tokens).
name: release-crates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install

      - name: Publish bffi-macros (already-published counts as skip)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CRATES_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          set +e
          out=$(cargo publish -p bffi-macros --token "$CARGO_REGISTRY_TOKEN" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q "already exists"; then
            echo "bffi-macros is already published at this version - skipping."
            exit 0
          fi
          exit $code

      - name: Publish bffi (already-published counts as skip)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CRATES_TOKEN is not configured - add the repository secret to enable publishing."
            exit 1
          fi
          set +e
          out=$(cargo publish -p bffi --token "$CARGO_REGISTRY_TOKEN" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q "already exists"; then
            echo "bffi is already published at this version - skipping."
            exit 0
          fi
          exit $code
