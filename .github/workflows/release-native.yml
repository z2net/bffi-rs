# Builds the reference native library (crates/bffi-native) on every
# shipped platform and uploads the cdylib artifacts. Manual,
# artifact-only companion of release-npm.yml (which builds, packs and
# publishes the same binaries itself).
#
# Platform notes:
# - darwin-x64 is CROSS-COMPILED on the arm64 runner (Xcode links
#   x86_64-apple-darwin natively); the macos-13 (x64) runner pool is
#   too starved to rely on.
# - musl cdylibs need the musl linker: `musl-tools` on the matching
#   architecture runner (pure-Rust crates, no extra C deps).
name: release-native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,       triple: win32-x64-msvc,   artifact: bffi_native.dll }
          - { os: windows-11-arm,       triple: win32-arm64-msvc, artifact: bffi_native.dll }
          - { os: ubuntu-latest,        triple: linux-x64-gnu,    artifact: libbffi_native.so }
          - { os: ubuntu-latest,        triple: linux-x64-musl,   artifact: libbffi_native.so,  target: x86_64-unknown-linux-musl, musl: "true" }
          - { os: ubuntu-24.04-arm,     triple: linux-arm64-gnu,  artifact: libbffi_native.so }
          - { os: ubuntu-24.04-arm,     triple: linux-arm64-musl, artifact: libbffi_native.so,  target: aarch64-unknown-linux-musl, musl: "true" }
          - { os: macos-latest,         triple: darwin-aarch64,   artifact: libbffi_native.dylib }
          - { os: macos-latest,         triple: darwin-x64,       artifact: libbffi_native.dylib, target: x86_64-apple-darwin }
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The repo pins the toolchain via rust-toolchain.toml (1.98.0);
      # rustup resolves it on the first cargo invocation.
      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install musl tools (musl cdylib linker)
        if: matrix.musl == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build the release cdylib
        shell: bash
        env:
          # musl targets default to crt-static, and rustc drops the
          # cdylib for a statically-linked musl target; dynamic musl
          # linking is exactly what a platform .so needs.
          RUSTFLAGS: ${{ matrix.musl == 'true' && '-C target-feature=-crt-static' || '' }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p bffi-native --target ${{ matrix.target }}
          else
            cargo build --release -p bffi-native
          fi

      - name: Emit the loader JSON (schema sanity check)
        run: cargo run -p bffi-native --bin emit-json

      - name: Upload the cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: bffi-native-${{ matrix.triple }}
          path: |
            ${{ matrix.target != '' && format('target/{0}/release/', matrix.target) || 'target/release/' }}${{ matrix.artifact }}
          if-no-files-found: error
