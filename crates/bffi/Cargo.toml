[package]
name = "bffi"
description = "The public facade of the bffi-rs Bun binding framework: one crate containing the whole stack, with unsafe_zero_copy as the only zero-copy door."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = [
    "core",
    "types",
    "error",
    "dts",
    "object",
    "build",
    "callback",
    "event-loop",
    "stream",
    "async",
    "macros",
    "class",
]
core = []
types = ["core"]
error = ["core"]
dts = []
object = ["core"]
build = ["core", "types", "error", "dts"]
callback = ["core", "types", "build"]
event-loop = ["core", "callback"]
stream = ["core", "types", "build"]
async = ["core", "types", "build", "event-loop"]
macros = ["dep:bffi-macros", "core", "types", "build", "dts"]
class = ["macros", "object"]
tokio = ["async", "dep:tokio"]

[dependencies]
bffi-macros = { path = "../bffi-macros", version = "0.2.1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time", "sync"] }

[dev-dependencies]
serde_json = "1"
criterion = "0.5"

[[bench]]
name = "wire_bench"
harness = false

[[bench]]
name = "handles_bench"
harness = false

[[bench]]
name = "callback_bench"
harness = false

[[bench]]
name = "event_loop_bench"
harness = false

[[bench]]
name = "utf8_bench"
harness = false
