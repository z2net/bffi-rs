name: CI

# CI parity with `bun run ci`, spread across the operating systems the
# foundation is expected to support. The macOS runner is arm64, which
# exercises the aarch64 NEON UTF-8 validation path.
on:
  # every pull request is checked regardless of its target branch (stacked
  # feature PRs must be validated too); pushes are limited to the mainlines
  pull_request:
  push:
    branches: [main, dev/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # the wry example is a workspace member: on Linux it links
      # webkit2gtk/gtk through pkg-config - the dev packages must be
      # present before any cargo step (Windows/macOS need nothing)
      - name: Install GTK/webkit dev packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (debug)
        run: cargo test --workspace

      # release configuration on one OS keeps the matrix cheap while still
      # covering the optimized build of the lock-free and SIMD code
      - name: cargo test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --release

      # the tokio opt-in feature of the async module: keep the gated code
      # compiling and tested (one OS keeps the matrix cheap)
      - name: cargo test bffi-async (tokio feature)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy -p bffi --features tokio --all-targets -- -D warnings
          cargo test -p bffi --features tokio

      # minimal feature slices must compile: the facade re-exports are
      # feature-gated, and this step keeps them from rotting (one OS,
      # checks only - no new matrix entries)
      - name: cargo check bffi (feature slices)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo check -p bffi --no-default-features
          cargo check -p bffi --no-default-features --features core
          cargo check -p bffi --no-default-features --features class
          cargo check -p bffi --no-default-features --features macros,async

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # `bun run build` shells out to cargo for every example crate -
      # install the pinned toolchain explicitly ONCE (a rustup
      # auto-install mid-job races its own components and can fail
      # with a "partially installed toolchain" conflict), and bring
      # the GTK/webkit dev packages for the wry example on Linux.
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install GTK/webkit dev packages (wry example)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      - name: tsc
        run: bun run typecheck

      - name: bun unit tests (packages)
        run: bun test packages

      # prewarm the cargo cache (the example pipelines reuse it: an
      # unchanged crate makes the in-pipeline build nearly free)
      - name: cargo build (release, examples)
        run: bun run build

      - name: bun test (example e2e, full pipeline)
        run: bun test examples

  # supply-chain policy: license/ban/source checks are strict, the
  # RUSTSEC advisory scan is informational until 1.0 (known advisories
  # in dependencies must not block CI). One OS, no compilation -
  # cargo-deny/cargo-audit only resolve the dependency graph, so the
  # GTK/webkit packages the other jobs need are not required here.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # match the rust/js jobs: the pinned toolchain, installed once
      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check (advisories, bans, licenses, sources)
        run: cargo deny check

      # advisories are informational until 1.0
      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        continue-on-error: true
        run: cargo audit
