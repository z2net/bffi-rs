[package]
name = "bffi-example-event-loop"
description = "Example bffi-rs native module: the event-loop surface (enqueue/pump drain, marshal, blocking run on a worker thread, sticky stop), doubling as the e2e test of the .bffi pipeline."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/z2net/bffi-rs"
rust-version = "1.98.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes .bffi/bffi.api.json from module_def::MODULE (the loader JSON
# artifact consumed by the @z2net/bffi pipeline).
name = "emit-json"
path = "src/bin/emit_json.rs"

[dependencies]
bffi = "0.1.2"
